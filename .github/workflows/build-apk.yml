name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use stable debug keystore
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Force IPv4-only DNS resolution for Python
        run: |
          SITE_DIR=$(python3 -c "import site; print(site.getsitepackages()[0])")
          cat > "$SITE_DIR/sitecustomize.py" <<'PY'
          import socket

          _orig_getaddrinfo = socket.getaddrinfo

          def _ipv4_only_getaddrinfo(
              host, port, family=0, type=0, proto=0, flags=0
          ):
              return _orig_getaddrinfo(
                  host,
                  port,
                  socket.AF_INET,
                  type,
                  proto,
                  flags
              )

          socket.getaddrinfo = _ipv4_only_getaddrinfo
          PY

          echo "sitecustomize.py written to $SITE_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev automake build-essential

      - name: Install Buildozer
        run: |
          pip install --upgrade buildozer cython

      - name: Build with Buildozer
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      # ----------------------------------------------------------------
      # Переподпись APK постоянным ключом ci/debug.keystore.
      #
      # Buildozer/p4a подписывает debug-APK своим ключом, а не тем, что
      # лежит в ~/.android/debug.keystore (SHA-1 в логе не совпал). Вход
      # через Google проверяет пару "пакет + SHA-1", поэтому подпись
      # должна быть ВСЕГДА одной и той же — SHA-1 этого ключа внесён в
      # Google Cloud Console (Clients -> Android).
      #
      # Порядок: снять старую подпись -> zipalign -> apksigner sign.
      # ----------------------------------------------------------------
      - name: Re-sign APK with stable keystore
        run: |
          set -e
          BT=$(ls -d ~/.buildozer/android/platform/android-sdk/build-tools/*/ 2>/dev/null | sort -V | tail -1)
          if [ -z "$BT" ]; then
            echo "Android build-tools not found under ~/.buildozer"
            exit 1
          fi
          echo "Using build-tools: $BT"

          SRC=$(ls bin/*.apk | head -1)
          echo "Source APK: $SRC"

          mkdir -p signed
          cp "$SRC" signed/unsigned.apk

          # Убираем прежние файлы подписи (zip возвращает код 12, если
          # удалять нечего — это не ошибка).
          zip -q -d signed/unsigned.apk \
            'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/MANIFEST.MF' \
            || true

          "${BT}zipalign" -f -p 4 signed/unsigned.apk signed/aligned.apk

          "${BT}apksigner" sign \
            --ks ci/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out signed/healthtracker-signed.apk \
            signed/aligned.apk

          "${BT}apksigner" verify --print-certs signed/healthtracker-signed.apk

          echo "BT=$BT" >> "$GITHUB_ENV"

      # Диагностика: SHA-1 ключа и итогового APK должны совпасть, а также
      # совпасть со значением в Google Cloud Console.
      - name: Print signing SHA-1 (keystore and signed APK)
        run: |
          KS_SHA1=$(keytool -list -v -keystore ci/debug.keystore \
            -alias androiddebugkey -storepass android 2>&1 | grep "SHA1" || echo "SHA1: (не удалось прочитать)")
          APK_SHA1=$("${BT}apksigner" verify --print-certs signed/healthtracker-signed.apk 2>&1 \
            | grep -i "SHA-1" || echo "(не удалось прочитать подпись APK)")

          {
            echo "## Подпись сборки (для Google Cloud Console)"
            echo ""
            echo "APK: \`signed/healthtracker-signed.apk\`"
            echo ""
            echo "**Ключ ci/debug.keystore:**"
            echo ""
            echo "\`\`\`"
            echo "$KS_SHA1"
            echo "\`\`\`"
            echo ""
            echo "**Подписанный APK:**"
            echo ""
            echo "\`\`\`"
            echo "$APK_SHA1"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "ci/debug.keystore -> $KS_SHA1"
          echo "signed APK        -> $APK_SHA1"

      - name: Show last lines of build log
        if: failure()
        run: |
          echo "=============================================="
          echo "LAST 500 LINES OF BUILD LOG"
          echo "=============================================="
          tail -n 500 build.log

      - name: Extract Gradle error
        if: failure()
        run: |
          echo "=============================================="
          echo "GRADLE ERROR SUMMARY"
          echo "=============================================="

          grep -n -E \
            "FAILURE:|What went wrong:|Execution failed|Caused by:|Could not resolve|Could not find|Duplicate class|Manifest merger failed|AAPT|Exception|error:" \
            build.log \
            | tail -n 200 \
            || true

          echo ""
          echo "=============================================="
          echo "GRADLE FAILURE CONTEXT"
          echo "=============================================="

          FAILURE_LINE=$(grep -n "FAILURE: Build failed with an exception" build.log | tail -n 1 | cut -d: -f1)

          if [ -n "$FAILURE_LINE" ]; then
            START=$((FAILURE_LINE - 30))
            if [ "$START" -lt 1 ]; then
              START=1
            fi

            END=$((FAILURE_LINE + 180))

            echo "Showing build.log lines $START-$END"
            sed -n "${START},${END}p" build.log
          else
            echo "Gradle FAILURE marker not found."
          fi

      - name: Show download attempts
        if: failure()
        run: |
          echo "=============================================="
          echo "DOWNLOAD ATTEMPTS"
          echo "=============================================="

          grep -n -i \
            "Downloading\|Download failed\|Network is unreachable\|Cannot assign requested address" \
            build.log \
            || echo "(download errors not found)"

      - name: Show Java and Gradle versions
        if: failure()
        run: |
          echo "=============================================="
          echo "JAVA"
          echo "=============================================="
          java -version

          echo ""
          echo "=============================================="
          echo "JAVA HOME"
          echo "=============================================="
          echo "$JAVA_HOME"

          echo ""
          echo "=============================================="
          echo "ANDROID ENVIRONMENT"
          echo "=============================================="
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"
          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      # Загружаем ПЕРЕПОДПИСАННЫЙ APK (с ключом ci/debug.keystore).
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: healthtracker-apk
          path: signed/healthtracker-signed.apk
